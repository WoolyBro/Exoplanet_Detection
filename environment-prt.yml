# petitRADTRANS environment for Stage B atmospheres, the forecast and the retrievals.
# Create: micromamba create -f environment-prt.yml   (or conda env create -f environment-prt.yml)
# Then the opacity data: see eda/FORECAST_RESULTS.md section 6 and stage_b_atmospheres/forward_model.py.
# Exact versions as run (osx-arm64): environment-prt-lock-osx-arm64.yml
name: prt
channels:
  - conda-forge
dependencies:
  - astropy
  - gfortran
  - h5py
  - matplotlib
  - meson
  - meson-python
  - ninja
  - numpy
  - pandas
  - pip
  - python=3.12
  - scikit-learn
  - scipy
  - pip:
    - bs4==0.0.2
    - cftime==1.6.6.1
    - charset-normalizer==3.5.2
    - corner==2.3.0
    - dill==0.4.1
    - dynesty==2.1.5
    - exo-k==1.3.2
    - h11==0.16.0
    - llvmlite==0.50.0
    - molmass==2026.8.15
    - nestle==0.2.1
    - netCDF4==1.7.5
    - ninja==1.13.2
    - numba==0.68.0
    - outcome==1.3.0.post0
    - petitRADTRANS==3.4.0
    - pymultinest==2.12
    - pyvo==1.9.1
    - requests==2.34.2
    - selenium==4.51.0
    - skycalc_cli==1.5
    - sniffio==1.3.1
    - trio==0.34.0
    - trio-websocket==0.12.2
    - websocket-client==1.9.2
    - wsproto==1.3.2

prefix: "/Users/ayushmondal/micromamba/envs/prt"
